<header class="pc-header">
    <div class="header-wrapper"> <!-- [Mobile Media Block] start -->
        <div class="me-auto pc-mob-drp">
            <ul class="list-unstyled">
                <li class="pc-h-item header-mobile-collapse">
                    <a href="#" class="pc-head-link head-link-secondary ms-0" id="sidebar-hide">
                        <i class="ti ti-menu-2"></i>
                    </a>
                </li>
                <li class="pc-h-item pc-sidebar-popup">
                    <a href="#" class="pc-head-link head-link-secondary ms-0" id="mobile-collapse">
                        <i class="ti ti-menu-2"></i>
                    </a>
                </li>
            </ul>
        </div>
        <!-- [Mobile Media Block end] -->
        <div class="ms-auto">
            <ul class="list-unstyled">
                {% include "layout/dashboard/notifications.html" %}
                <li class="dropdown pc-h-item header-user-profile" id="button-dropdown-navbar">
                    <a class="pc-head-link head-link-primary dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown"
                        href="#" role="button" aria-haspopup="false" aria-expanded="false">
                        <img src="{{ user.picture() }}" alt="user-image" class="user-avtar">
                        <span>
                            <i class="ti ti-settings"></i>
                        </span>
                    </a>
                    <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown">
                        <div class="dropdown-header">
                            <h4>Salut, <span class="small text-muted"> {{ user.name() }}</span></h4>

                            <hr>

                            {% if user.is_admin() %}
                            <a href="/admin" class="dropdown-item">
                                <i class="ti ti-shield-check"></i>
                                <span>Admin Panel</span>
                            </a>
                            {% endif %}
                            <a href="/dashboard/profile" class="dropdown-item">
                                <i class="ti ti-user"></i>
                                <span>My Profile</span>
                            </a>
                            <a href="/dashboard/reports" class="dropdown-item">
                                <i class="ti ti-chart-bar"></i>
                                <span>Reports & Analytics</span>
                            </a>
                            <a href="/dashboard/settings/integrations" class="dropdown-item">
                                <i class="ti ti-plug"></i>
                                <span>Integrations</span>
                            </a>
                            <a href="/dashboard/settings/notifications" class="dropdown-item">
                                <i class="ti ti-bell-cog"></i>
                                <span>Notification Settings</span>
                            </a>

                            <hr>

                            <div class="profile-notification-scroll position-relative"
                                style="max-height: calc(100vh - 280px)">
                                <a href="/logout" class="dropdown-item">
                                    <i class="ti ti-logout"></i>
                                    <span>Logout</span>
                                </a>

                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</header>
