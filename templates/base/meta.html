{{ meta.csp_policy|safe }}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Language" content="fr">
<meta name="description" content="{{ meta.meta_description }}">
<meta name="keywords" content="{{ meta.meta_keywords }}">
<meta name="author" content="{{ meta.meta_author }}">
<link rel="canonical" href="{{ meta.meta_url }}" />
<title>{{ meta.meta_title }}</title>

<!-- Twitter Card data -->
<meta name="twitter:site" content="{{ meta.twitter.site }}">
<meta name="twitter:title" content="{{ meta.twitter.title }}">
<meta name="twitter:description" content="{{ meta.twitter.description }}">
<meta name="twitter:creator" content="{{ meta.twitter.creator }}">
<meta name="twitter:url" content="{{ meta.twitter.creator }}">
<meta name="twitter:card" content="{{ meta.twitter.description }}">
<meta name="twitter:image" content="{{ meta.twitter.image }}">

<!-- [Favicon] icon -->
<link rel="icon" href="https://ik.imagekit.io/smartlinker/images/logo-dark.svg" type="image/x-icon">
